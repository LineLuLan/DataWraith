name: Executable

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - "DataWraith.spec"
      - "datawraith/**"
      - "pyproject.toml"
      - ".github/workflows/executable.yml"

jobs:
  pyinstaller:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build executable
        run: pyinstaller DataWraith.spec --clean --noconfirm

      - name: Smoke executable
        run: dist\sdb.exe --version

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: datawraith-sdb-windows
          path: dist/sdb.exe
