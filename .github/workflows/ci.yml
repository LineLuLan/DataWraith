name: CI

on:
  push:
    branches: [main, dev, dev-*, codex/*]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy datawraith

      - name: Test
        run: pytest

      - name: Build wheel
        run: python -m build

      - name: Build docs
        run: mkdocs build --strict

  postgres-e2e:
    name: PostgreSQL fallback E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datawraith
          POSTGRES_PASSWORD: datawraith
          POSTGRES_DB: datawraith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datawraith -d datawraith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATAWRAITH_E2E_DATABASE_URL: postgresql://datawraith:datawraith@localhost:5432/datawraith

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run v1 PostgreSQL fallback E2E
        run: pytest tests/test_phase1_e2e.py tests/test_phase2_e2e.py tests/test_phase3_e2e.py tests/test_phase4_e2e.py
