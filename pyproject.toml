[project]
name = "datawraith"
version = "0.1.0"
description = "PostgreSQL chaos-testing tool — pip install, no Docker, no setup"
readme = "docs/PackageREADME.md"
authors = [
    { name = "100B Studio", email = "hello@datawraith.dev" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["postgresql", "chaos-testing", "load-testing", "database", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pgserver>=0.1.4,<0.2.0; python_version < '3.13'",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "textual>=1.0.0",
    "typer>=0.12.0",
    "faker>=30.0.0",
    "mimesis>=18.0.0",
    "rich>=13.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pyinstaller>=6.0.0",
    "textual-dev>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
sdb = "datawraith.cli:app"
datawraith = "datawraith.cli:app"

[project.urls]
Homepage = "https://datawraith.dev"
Repository = "https://github.com/100b-studio/datawraith"
Documentation = "https://datawraith.dev/docs"
Issues = "https://github.com/100b-studio/datawraith/issues"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datawraith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --basetemp=.pytest-tmp --cov=datawraith --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "ASYNC", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
