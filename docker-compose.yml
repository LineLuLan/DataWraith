services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datawraith
      POSTGRES_PASSWORD: datawraith
      POSTGRES_DB: datawraith
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datawraith -d datawraith"]
      interval: 5s
      timeout: 5s
      retries: 12
